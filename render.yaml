services:
  - type: web
    name: distributed-task-queue
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash start.sh
    plan: free
    region: singapore
    envVars:
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: API_KEY
        generateValue: true
      - key: APP_ENV
        value: production
