app = "dtq-worker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  REDIS_HOST       = "dtq-redis.internal"
  REDIS_PORT       = "6379"
  REDIS_DB_BROKER  = "0"
  REDIS_DB_BACKEND = "1"
  APP_ENV          = "production"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "celery -A app.celery_app.worker.celery_app worker --queues=high,default,low --concurrency=4 --loglevel=info"
