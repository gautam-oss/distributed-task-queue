app = "dtq-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  REDIS_HOST       = "dtq-redis.internal"
  REDIS_PORT       = "6379"
  REDIS_DB_BROKER  = "0"
  REDIS_DB_BACKEND = "1"
  APP_ENV          = "production"

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = false
  auto_start_machines = true

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
