services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  worker_high:
    build: .
    command: celery -A app.celery_app.worker.celery_app worker --queues=high --concurrency=4 --loglevel=info --hostname=worker-high@%h
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  worker_default:
    build: .
    command: celery -A app.celery_app.worker.celery_app worker --queues=default --concurrency=2 --loglevel=info --hostname=worker-default@%h
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  worker_low:
    build: .
    command: celery -A app.celery_app.worker.celery_app worker --queues=low --concurrency=2 --loglevel=info --hostname=worker-low@%h
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build: .
    command: celery -A app.celery_app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
